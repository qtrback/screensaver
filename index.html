<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Screensaver</title>
  <style>
    /* ── Reset & Layout ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── UI Panel ──────────────────────────────────────────────────────────── */
    #ui {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      z-index: 100;
      transition: opacity 0.6s ease;
    }

    #ui.hidden { opacity: 0; pointer-events: none; }

    .ui-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 8px 14px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    #shape-count {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
    }

    /* ── Cumulative Type Counts panel (top-left, session-only) ───────────── */
    #type-counts {
      position: fixed;
      top: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 8px 14px;
    }

    #type-counts:empty { display: none; }

    .type-count-row {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.85);
    }

    /* Add-shape button */
    #btn-add {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #btn-add:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.1);
    }

    #btn-add:active { transform: scale(0.96); }

    #btn-remove {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #btn-remove:hover:not(:disabled) {
      background: rgba(255, 80, 80, 0.25);
      border-color: rgba(255, 100, 100, 0.6);
      transform: scale(1.1);
    }
    #btn-remove:active:not(:disabled) { transform: scale(0.96); }
    #btn-remove:disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }

    /* Intent label toggle + theme toggle (same button family) */
    #btn-labels,
    #btn-theme {
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      padding: 5px 10px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.2s, color 0.2s;
    }

    #btn-labels:hover,
    #btn-theme:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    /* ── Intent Labels (CSS2DRenderer not used; we use HTML divs) ───── */
    .intent-label {
      position: fixed;
      pointer-events: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(0, 0, 0, 0.45);
      border-radius: 6px;
      padding: 2px 6px;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    .cow-message {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 10px 18px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 50;
    }

    /* ── Light theme overrides ──────────────────────────────────────────
       Applied via body.theme-light, toggled at runtime by JS. Dark theme
       (the default, unconditional on load) is everything above, untouched. */
    body.theme-light {
      background: #f2f0ea;
    }

    body.theme-light .ui-badge {
      background: rgba(20, 18, 14, 0.06);
      border: 1px solid rgba(20, 18, 14, 0.18);
      color: rgba(20, 18, 14, 0.75);
    }

    body.theme-light #shape-count {
      color: rgba(20, 18, 14, 0.9);
    }

    body.theme-light #type-counts {
      background: rgba(20, 18, 14, 0.06);
      border: 1px solid rgba(20, 18, 14, 0.18);
    }

    body.theme-light .type-count-row {
      color: rgba(20, 18, 14, 0.9);
    }

    body.theme-light #btn-add,
    body.theme-light #btn-remove {
      border: 1.5px solid rgba(20, 18, 14, 0.3);
      background: rgba(20, 18, 14, 0.07);
      color: #201c14;
    }

    body.theme-light #btn-add:hover {
      background: rgba(20, 18, 14, 0.14);
      border-color: rgba(20, 18, 14, 0.55);
    }

    body.theme-light #btn-remove:hover:not(:disabled) {
      background: rgba(200, 60, 40, 0.16);
      border-color: rgba(200, 60, 40, 0.5);
    }

    body.theme-light #btn-labels,
    body.theme-light #btn-theme {
      border: 1px solid rgba(20, 18, 14, 0.22);
      background: rgba(20, 18, 14, 0.05);
      color: rgba(20, 18, 14, 0.65);
    }

    body.theme-light #btn-labels:hover,
    body.theme-light #btn-theme:hover {
      background: rgba(20, 18, 14, 0.12);
      color: #14120e;
    }

    body.theme-light .intent-label {
      color: rgba(20, 18, 14, 0.85);
      background: rgba(255, 255, 255, 0.7);
    }

    body.theme-light .cow-message {
      color: #201c14;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(20, 18, 14, 0.2);
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Cumulative per-type appearance counts (session-only, top-left) -->
<div id="type-counts"></div>

<!-- UI controls -->
<div id="ui">
  <div class="ui-badge" id="shape-count">Shapes: 1</div>
  <button id="btn-theme">light mode</button>
  <button id="btn-labels">labels on</button>
  <button id="btn-remove" title="Remove shape">&#x2212;</button>
  <button id="btn-add" title="Add shape">+</button>
</div>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════════════════
   SECTION 1 — BALLISTIC PHYSICS HELPERS
   ─────────────────────────────────────────────────────────────────────────────
   Pure billiard-ball physics: straight-line integration, wall reflection, and
   speed clamping. NO steering, NO target-seeking, NO attractors.
   ══════════════════════════════════════════════════════════════════════════════ */

const IntentRegistry = (() => {
  /* ── Physics constants ──────────────────────────────────────────────────── */
  const MAX_SPEED = 1.8;      // world-units / second cap
  const MIN_SPEED = 0.3;      // world-units / second floor — no object settles
  // clamp kept so resolveCollisions (which imports nothing) can share the value
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v)); // eslint-disable-line no-unused-vars

  /** Apply velocity to position — straight-line ballistic integration. */
  function integrate(pos, vel, dt) {
    pos.x += vel.x * dt;
    pos.y += vel.y * dt;
    pos.z += vel.z * dt;
  }

  /** Reflect velocity off the bounding-box walls (angle-of-incidence bounce). */
  function bounce(pos, vel, bounds) {
    ['x', 'y', 'z'].forEach(axis => {
      if (pos[axis] > bounds[axis]) {
        pos[axis] = bounds[axis];
        if (vel[axis] > 0) vel[axis] *= -1;
      } else if (pos[axis] < -bounds[axis]) {
        pos[axis] = -bounds[axis];
        if (vel[axis] < 0) vel[axis] *= -1;
      }
    });
    // Clamp speed after wall bounce so restitution stays floaty
    const spd = Math.sqrt(vel.x ** 2 + vel.y ** 2 + vel.z ** 2);
    if (spd > MAX_SPEED) {
      const s = MAX_SPEED / spd;
      vel.x *= s; vel.y *= s; vel.z *= s;
    }
  }

  /**
   * Enforce the minimum-speed floor on a velocity object.
   * If speed < MIN_SPEED, nudge it back up to MIN_SPEED preserving direction.
   * If essentially zero, give it a gentle random drift.
   */
  function enforceMinSpeed(vel) {
    const spd = Math.sqrt(vel.x ** 2 + vel.y ** 2 + vel.z ** 2);
    if (spd < 0.001) {
      // Essentially zero — give a random drift direction at MIN_SPEED
      const a1 = Math.random() * Math.PI * 2;
      const a2 = (Math.random() - 0.5) * Math.PI;
      vel.x = Math.cos(a1) * Math.cos(a2) * MIN_SPEED;
      vel.y = Math.sin(a2) * MIN_SPEED;
      vel.z = Math.sin(a1) * Math.cos(a2) * MIN_SPEED;
    } else if (spd < MIN_SPEED) {
      const s = MIN_SPEED / spd;
      vel.x *= s; vel.y *= s; vel.z *= s;
    }
  }

  /* ── Public API ─────────────────────────────────────────────────────────── */
  return { integrate, bounce, enforceMinSpeed };
})();


/* ══════════════════════════════════════════════════════════════════════════════
   SECTION 2 — INTENT ENGINE
   ─────────────────────────────────────────────────────────────────────────────
   Manages per-shape state (velocity, label) and ticks pure ballistic motion
   each frame: integrate → bounce → enforceMinSpeed. No behavior dispatch.
   ══════════════════════════════════════════════════════════════════════════════ */

class IntentEngine {
  constructor() {
    /**
     * Map<mesh, { intent: string, state: object }>
     * state holds velocity plus per-shape motion flags.
     */
    this._entries = new Map();
  }

  /**
   * Register a shape with a label string.
   * @param {THREE.Object3D} mesh
   * @param {string} intent  — used only as the on-screen label
   */
  assign(mesh, intent) {
    this._entries.set(mesh, {
      intent,
      state: {
        // Pre-seed velocity so every shape starts moving immediately
        vel: {
          x: (Math.random() - 0.5) * 1.0,
          y: (Math.random() - 0.5) * 1.0,
          z: (Math.random() - 0.5) * 1.0,
        },
        frozen: false,
      },
    });
  }

  /** Remove a shape from the engine. */
  remove(mesh) {
    this._entries.delete(mesh);
  }

  /** Get the current label string for a mesh. */
  getIntent(mesh) {
    return this._entries.get(mesh)?.intent ?? 'bounce';
  }

  /** Get the mutable state object for a mesh (used by resolveCollisions). */
  getState(mesh) {
    return this._entries.get(mesh)?.state ?? null;
  }

  /** Toggle whether a registered mesh skips its motion tick. */
  toggleFrozen(mesh) {
    const entry = this._entries.get(mesh);
    if (!entry) return false;
    entry.state.frozen = !entry.state.frozen;
    return entry.state.frozen;
  }

  /** Read whether a registered mesh is frozen. */
  isFrozen(mesh) {
    return this._entries.get(mesh)?.state.frozen ?? false;
  }

  /**
   * Tick all registered shapes — pure ballistic integration only.
   * @param {THREE.Object3D[]} _allShapes  — unused (kept for call-site compat)
   * @param {{ x, y, z }} bounds           — half-extents
   * @param {number} dt                    — delta time in seconds
   */
  update(_allShapes, bounds, dt) {
    const { integrate, bounce, enforceMinSpeed } = IntentRegistry;

    for (const [mesh, entry] of this._entries) {
      if (entry.state.frozen) continue;

      // ── Pure ballistic motion: straight line + wall reflect + speed floor ──
      integrate(mesh.position, entry.state.vel, dt);
      bounce(mesh.position, entry.state.vel, bounds);
      enforceMinSpeed(entry.state.vel);

      // ── Decorative spin — uniform across all shapes ──────────────────────
      const rotSpeed = 0.5;
      mesh.rotation.x += dt * rotSpeed * 0.7;
      mesh.rotation.y += dt * rotSpeed * 1.1;
      mesh.rotation.z += dt * rotSpeed * 0.4;
    }
  }
}


/* ══════════════════════════════════════════════════════════════════════════════
   SECTION 3 — SHAPE FACTORY
   ─────────────────────────────────────────────────────────────────────────────
   Geometry registry: adding a new shape type = one registration line.
   ══════════════════════════════════════════════════════════════════════════════ */

const ShapeFactory = (() => {
  /* Geometry registry — one entry per shape type */
  const _geometries = new Map([
    ['cube',        () => new THREE.BoxGeometry(0.9, 0.9, 0.9)],
    ['sphere',      () => new THREE.SphereGeometry(0.55, 32, 24)],
    ['tetrahedron', () => new THREE.TetrahedronGeometry(0.72)],
    ['torus',       () => new THREE.TorusGeometry(0.45, 0.18, 16, 64)],
    ['octahedron',  () => new THREE.OctahedronGeometry(0.65)],
    ['dodecahedron',() => new THREE.DodecahedronGeometry(0.55)],
    ['cone',        () => new THREE.ConeGeometry(0.5, 1.0, 6)],
    ['cylinder',    () => new THREE.CylinderGeometry(0.3, 0.5, 1.0, 8)],
  ]);

  const _geoNames = [..._geometries.keys()];

  /* Pastel palette — soft, light, low-saturation distinct tones (dark-theme default) */
  const _colors = [
    0xffb3ba, 0xffc5a8, 0xffe0a3, 0xfff3b0, 0xe6f5a3,
    0xc1e8b0, 0xa8e6cf, 0xa3e4e0, 0xa8d8f0, 0xaec6f0,
    0xbcbdf0, 0xd0bdf0, 0xe4bdf0, 0xf0bde4, 0xf0bdcf,
    0xffb8c6, 0xd8e8b0, 0xb0e0d0, 0xc8d0f0, 0xf0c8d8,
  ];

  // Active palette used at spawn time — swapped by the theme system via setPalette().
  let _activePalette = _colors;
  let _colorIndex = 0;

  function pickColor() {
    // Cycle through the active palette so consecutive shapes have distinct colors
    const c = _activePalette[_colorIndex % _activePalette.length];
    _colorIndex++;
    return c;
  }

  return {
    /**
     * Register a new geometry.
     * @param {string} name
     * @param {Function} factoryFn - () => THREE.BufferGeometry
     */
    register(name, factoryFn) {
      _geometries.set(name, factoryFn);
      _geoNames.push(name);
    },

    /**
     * Swap the active color palette (used by the theme system). Only affects
     * shapes created AFTER this call — existing shapes are recolored separately.
     * @param {number[]} colors
     */
    setPalette(colors) {
      _activePalette = colors;
    },

    /**
     * Create a new Three.js mesh with random geometry and color.
     * The label string is the geometry name so labels still render.
     * @param {{ x, y, z }} bounds   - spawn within bounds
     * @returns {{ mesh: THREE.Mesh, intent: string, geoName: string }}
     */
    create(bounds) {
      // Random geometry
      const geoName = _geoNames[Math.floor(Math.random() * _geoNames.length)];
      const geometry = _geometries.get(geoName)();

      // Material — slightly transparent, physically-based
      const colorIndex = _colorIndex % _activePalette.length;
      const color = pickColor();
      const material = new THREE.MeshStandardMaterial({
        color,
        metalness: 0.0 + Math.random() * 0.1,
        roughness: 0.7 + Math.random() * 0.25,
        transparent: true,
        opacity: 0.82 + Math.random() * 0.16,
      });

      const mesh = new THREE.Mesh(geometry, material);
      // Remember which palette slot this shape used so the theme system can
      // re-derive its color from the new palette on a live theme switch.
      mesh.userData.colorIndex = colorIndex;

      // Random spawn position (inside bounds with a margin)
      mesh.position.set(
        (Math.random() - 0.5) * bounds.x * 0.8,
        (Math.random() - 0.5) * bounds.y * 0.8,
        (Math.random() - 0.5) * bounds.z * 0.6,
      );

      // Random initial rotation
      mesh.rotation.set(
        Math.random() * Math.PI * 2,
        Math.random() * Math.PI * 2,
        Math.random() * Math.PI * 2,
      );

      // Use geometry name as the descriptive label (no behavior driving motion)
      const intent = geoName;

      // Store metadata on the mesh for the label system
      mesh.userData.intent  = intent;
      mesh.userData.geoName = geoName;

      return { mesh, intent, geoName };
    },
  };
})();


/* COW FACTORY -- createCow(bounds)
   Builds a small, cartoonish "flying cow" easter-egg mesh out of Three.js
   primitives, returned as a THREE.Group. Built at a comfortable working
   scale then shrunk down so it reads as visibly smaller than the regular
   ShapeFactory shapes (which run ~0.5-0.9 units). */

function createCow(bounds, cowColors) {
  const group = new THREE.Group();

  // Cow material palette — theme-aware. Falls back to the dark-theme (current)
  // values if no theme palette is supplied, so behavior is unchanged by default.
  const cc = cowColors || {
    white: 0xffffff, pink: 0xffb6c9, black: 0x1a1a1a,
    brown: 0x4a2f1c, gold: 0xffd23f, gray: 0xeeeeee,
  };

  const white  = new THREE.MeshStandardMaterial({ color: cc.white, roughness: 0.6, metalness: 0.05 });
  const pink   = new THREE.MeshStandardMaterial({ color: cc.pink, roughness: 0.5, metalness: 0.05 });
  const black  = new THREE.MeshStandardMaterial({ color: cc.black, roughness: 0.5, metalness: 0.1 });
  const brown  = new THREE.MeshStandardMaterial({ color: cc.brown, roughness: 0.6, metalness: 0.05 });
  const gold   = new THREE.MeshStandardMaterial({ color: cc.gold, roughness: 0.3, metalness: 0.5 });
  const gray   = new THREE.MeshStandardMaterial({ color: cc.gray, roughness: 0.4, metalness: 0.1, transparent: true, opacity: 0.85 });

  // Tag each material with its logical cow-part name so a live theme switch
  // can traverse the group and re-derive colors from the new theme's cowColors.
  white.userData.cowPart  = 'white';
  pink.userData.cowPart   = 'pink';
  black.userData.cowPart  = 'black';
  brown.userData.cowPart  = 'brown';
  gold.userData.cowPart   = 'gold';
  gray.userData.cowPart   = 'gray';

  /* Body -- horizontal oval barrel */
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 2.0, 16), white);
  body.rotation.z = Math.PI / 2;
  body.position.set(0, 0, 0);
  group.add(body);

  /* Head -- oversized sphere at the front of the body */
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 20, 16), white);
  head.position.set(1.35, 0.25, 0);
  group.add(head);

  /* Eyes -- big goofy white spheres with black pupils */
  const eyeOffsets = [-0.32, 0.32];
  eyeOffsets.forEach(zOff => {
    const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), white);
    eyeWhite.position.set(1.75, 0.5, zOff);
    group.add(eyeWhite);

    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), black);
    pupil.position.set(1.9, 0.53, zOff);
    group.add(pupil);
  });

  /* Ears -- small pink cones on the sides of the head */
  [-1, 1].forEach(side => {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.35, 8), pink);
    ear.position.set(1.15, 0.75, side * 0.55);
    ear.rotation.x = side * 0.6;
    group.add(ear);
  });

  /* Snout -- flattened pink sphere on the front of the head */
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.32, 14, 10), pink);
  snout.position.set(1.9, 0.1, 0);
  snout.scale.set(0.7, 0.65, 1.0);
  group.add(snout);

  /* Nostrils (tiny black dots on snout) */
  [-0.12, 0.12].forEach(z => {
    const nostril = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), black);
    nostril.position.set(2.12, 0.1, z);
    group.add(nostril);
  });

  /* Horns -- two small cones on top of the head */
  [-1, 1].forEach(side => {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.28, 8), gray);
    horn.position.set(1.3, 0.95, side * 0.28);
    horn.rotation.z = -side * 0.35;
    group.add(horn);
  });

  /* Legs -- four stubby cylinders underneath the body */
  const legPositions = [
    [-0.7, -0.95, 0.55], [-0.7, -0.95, -0.55],
    [0.7, -0.95, 0.55],  [0.7, -0.95, -0.55],
  ];
  legPositions.forEach(([x, y, z]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.7, 8), white);
    leg.position.set(x, y, z);
    group.add(leg);

    /* Hooves -- small dark cylinders at the bottom of each leg */
    const hoof = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.18, 8), black);
    hoof.position.set(x, y - 0.44, z);
    group.add(hoof);
  });

  /* Tail -- thin, slightly curved cylinder at the back (tagged for animation) */
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 0.9, 6), brown);
  tail.name = 'tail';
  tail.position.set(-1.15, -0.15, 0);
  tail.rotation.z = Math.PI / 2.6;
  group.add(tail);

  /* Wings -- tiny comical angel wings, flat boxes on the back/sides */
  [-1, 1].forEach(side => {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.06, 0.5), gray);
    wing.position.set(-0.1, 0.55, side * 0.85);
    wing.rotation.z = side * 0.15;
    wing.rotation.y = side * 0.3;
    group.add(wing);
  });

  /* Spots -- 3-5 flattened dark ovals on the body surface */
  const spotCount = 3 + Math.floor(Math.random() * 3); // 3-5
  for (let i = 0; i < spotCount; i++) {
    const spot = new THREE.Mesh(new THREE.SphereGeometry(0.25 + Math.random() * 0.15, 10, 8), brown);
    const angle = Math.random() * Math.PI * 2;
    const along = (Math.random() - 0.5) * 1.6;
    spot.position.set(along, Math.sin(angle) * 0.75, Math.cos(angle) * 0.75);
    spot.scale.set(0.5, 1, 1);
    spot.lookAt(spot.position.clone().multiplyScalar(2));
    group.add(spot);
  }

  /* Bell -- small golden sphere dangling under the neck with a strap */
  const strap = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6), brown);
  strap.position.set(1.05, -0.15, 0);
  group.add(strap);

  const bell = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), gold);
  bell.position.set(1.05, -0.42, 0);
  group.add(bell);

  /* Udders -- pink sphere cluster on the underside of the body */
  const udderOffsets = [[-0.25, -0.25], [0.25, -0.25], [-0.25, 0.25], [0.25, 0.25]];
  udderOffsets.forEach(([x, z]) => {
    const udder = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), pink);
    udder.position.set(x, -0.95, z);
    group.add(udder);
  });

  /* Scale the whole cow down so it reads as noticeably smaller than the
     regular ShapeFactory shapes (which are built at ~0.5-0.9 units). */
  group.scale.set(0.32, 0.32, 0.32);

  return group;
}


/* ─────────────────────────────────────────────────────────────────────
   createClown(bounds, clownColors) — the clown easter-egg, a first-class
   peer of the cow. Built from THREE primitives only (Cone/Sphere/Cylinder/
   Box) + MeshStandardMaterial, mirroring createCow. Each material is tagged
   with material.userData.clownPart so a live theme switch can re-derive its
   color from the active theme's clownColors palette.
   ───────────────────────────────────────────────────────────────────── */
function createClown(bounds, clownColors) {
  const group = new THREE.Group();

  // Clown material palette — theme-aware. Falls back to the dark-theme
  // values if no theme palette is supplied, so behavior is unchanged by
  // default (exactly like createCow's cc fallback).
  const cc = clownColors || {
    hat: 0x8a2be2, nose: 0xff2d2d, face: 0xfff4e8,
    suit: 0x1e90ff, ruffle: 0xffe14d, shoe: 0xff8c1a,
  };

  const hatMat    = new THREE.MeshStandardMaterial({ color: cc.hat, roughness: 0.5, metalness: 0.1 });
  const noseMat   = new THREE.MeshStandardMaterial({ color: cc.nose, roughness: 0.35, metalness: 0.05 });
  const faceMat   = new THREE.MeshStandardMaterial({ color: cc.face, roughness: 0.6, metalness: 0.05 });
  const suitMat   = new THREE.MeshStandardMaterial({ color: cc.suit, roughness: 0.55, metalness: 0.05 });
  const ruffleMat = new THREE.MeshStandardMaterial({ color: cc.ruffle, roughness: 0.45, metalness: 0.1 });
  const shoeMat   = new THREE.MeshStandardMaterial({ color: cc.shoe, roughness: 0.5, metalness: 0.05 });

  // Tag each material with its logical clown-part name so a live theme
  // switch can traverse the group and re-derive colors from clownColors.
  hatMat.userData.clownPart    = 'hat';
  noseMat.userData.clownPart   = 'nose';
  faceMat.userData.clownPart   = 'face';
  suitMat.userData.clownPart   = 'suit';
  ruffleMat.userData.clownPart = 'ruffle';
  shoeMat.userData.clownPart   = 'shoe';

  /* Head/face — big pale sphere */
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 20, 16), faceMat);
  head.position.set(0, 0.9, 0);
  group.add(head);

  /* Red nose — a small red sphere on the face-front */
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 12), noseMat);
  nose.position.set(0, 0.85, 0.68);
  group.add(nose);

  /* Eyes — small suit-colored spheres */
  [-0.28, 0.28].forEach(xOff => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), suitMat);
    eye.position.set(xOff, 1.02, 0.62);
    group.add(eye);
  });

  /* Cheeks — two little red dabs for extra clown flair */
  [-0.42, 0.42].forEach(xOff => {
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), noseMat);
    cheek.position.set(xOff, 0.78, 0.55);
    cheek.scale.set(1, 0.7, 0.5);
    group.add(cheek);
  });

  /* Pointed hat — a tall cone on top of the head */
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.1, 18), hatMat);
  hat.position.set(0, 1.85, 0);
  group.add(hat);

  /* Hat pom-pom — a ruffle-colored sphere at the tip */
  const pom = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), ruffleMat);
  pom.position.set(0, 2.5, 0);
  group.add(pom);

  /* Ruffle collar — a ring of small ruffle-colored cones at the neck */
  const ruffleCount = 10;
  for (let i = 0; i < ruffleCount; i++) {
    const a = (i / ruffleCount) * Math.PI * 2;
    const petal = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.32, 8), ruffleMat);
    petal.position.set(Math.cos(a) * 0.55, 0.28, Math.sin(a) * 0.55);
    petal.rotation.z = Math.PI / 2;
    petal.rotation.y = -a;
    group.add(petal);
  }

  /* Body/suit — a colorful barrel torso */
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.62, 1.1, 16), suitMat);
  body.position.set(0, -0.35, 0);
  group.add(body);

  /* Suit buttons — ruffle-colored dots down the front */
  [0.1, -0.25, -0.6].forEach(y => {
    const button = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), ruffleMat);
    button.position.set(0, y, 0.5);
    group.add(button);
  });

  /* Arms — two suit-colored cylinders angled out from the shoulders */
  [-1, 1].forEach(side => {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.9, 10), suitMat);
    arm.position.set(side * 0.62, -0.1, 0);
    arm.rotation.z = side * 0.9;
    group.add(arm);

    /* Face-colored hand at the end of each arm */
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), faceMat);
    hand.position.set(side * 1.0, -0.5, 0);
    group.add(hand);
  });

  /* Legs — two short suit-colored cylinders */
  [-0.28, 0.28].forEach(xOff => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.7, 10), suitMat);
    leg.position.set(xOff, -1.25, 0);
    group.add(leg);
  });

  /* Big shoes — oversized flattened boxes at the bottom */
  [-0.28, 0.28].forEach(xOff => {
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.24, 0.9), shoeMat);
    shoe.position.set(xOff, -1.68, 0.28);
    group.add(shoe);
  });

  /* Scale the whole clown down so it reads at the same size as the cow. */
  group.scale.set(0.32, 0.32, 0.32);

  return group;
}


/* ─────────────────────────────────────────────────────────────────────────────
   createBaby(bounds, babyColors) — the baby easter-egg, a first-class peer
   of createCow and createClown. Built from THREE primitives only (Sphere/
   Box/Cylinder/Cone) + MeshStandardMaterial, mirroring createCow/createClown.
   Each material is tagged with material.userData.babyPart so a live theme
   switch can re-derive its color from the active theme's babyColors palette.
   ───────────────────────────────────────────────────────────────────────────── */
function createBaby(bounds, babyColors) {
  const group = new THREE.Group();

  // Baby material palette — theme-aware. Falls back to the dark-theme
  // values if no theme palette is supplied, so behavior is unchanged by
  // default (exactly like createCow/createClown's cc fallback).
  const cc = babyColors || {
    skin: 0xffcc99, diaper: 0xffffff, hair: 0x8b4513,
    cheek: 0xffb3ba, eye: 0x1a1a1a, pacifier: 0xff6699,
  };

  const skinMat     = new THREE.MeshStandardMaterial({ color: cc.skin,     roughness: 0.6,  metalness: 0.05 });
  const diaperMat   = new THREE.MeshStandardMaterial({ color: cc.diaper,   roughness: 0.5,  metalness: 0.05 });
  const hairMat     = new THREE.MeshStandardMaterial({ color: cc.hair,     roughness: 0.55, metalness: 0.05 });
  const cheekMat    = new THREE.MeshStandardMaterial({ color: cc.cheek,    roughness: 0.5,  metalness: 0.05 });
  const eyeMat      = new THREE.MeshStandardMaterial({ color: cc.eye,      roughness: 0.4,  metalness: 0.1  });
  const pacifierMat = new THREE.MeshStandardMaterial({ color: cc.pacifier, roughness: 0.4,  metalness: 0.1  });

  // Tag each material with its logical baby-part name so a live theme
  // switch can traverse the group and re-derive colors from babyColors.
  skinMat.userData.babyPart     = 'skin';
  diaperMat.userData.babyPart   = 'diaper';
  hairMat.userData.babyPart     = 'hair';
  cheekMat.userData.babyPart    = 'cheek';
  eyeMat.userData.babyPart      = 'eye';
  pacifierMat.userData.babyPart = 'pacifier';

  /* Big round head — oversized sphere, baby-proportioned */
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 20, 16), skinMat);
  head.position.set(0, 0.85, 0);
  group.add(head);

  /* Chubby cheeks — two flattened pink spheres on sides of face */
  [-0.55, 0.55].forEach(xOff => {
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), cheekMat);
    cheek.position.set(xOff, 0.72, 0.58);
    cheek.scale.set(0.9, 0.7, 0.55);
    group.add(cheek);
  });

  /* Eyes — small dark spheres */
  [-0.28, 0.28].forEach(xOff => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), eyeMat);
    eye.position.set(xOff, 0.98, 0.68);
    group.add(eye);

    /* tiny white highlight dot on each eye */
    const highlight = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), diaperMat);
    highlight.position.set(xOff + 0.04, 1.01, 0.76);
    group.add(highlight);
  });

  /* Little curl of hair on top — two small spheres arcing upward */
  const hairCurl = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), hairMat);
  hairCurl.position.set(0.0, 1.6, 0.1);
  hairCurl.scale.set(0.7, 1.1, 0.7);
  group.add(hairCurl);

  const hairCurl2 = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), hairMat);
  hairCurl2.position.set(0.14, 1.68, 0.15);
  hairCurl2.scale.set(0.6, 1.0, 0.6);
  group.add(hairCurl2);

  /* Pacifier — a flat cylinder shield with a colored nipple sphere */
  const pacShield = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.06, 12), diaperMat);
  pacShield.position.set(0, 0.62, 0.74);
  pacShield.rotation.x = Math.PI / 2;
  group.add(pacShield);

  const pacNipple = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), pacifierMat);
  pacNipple.position.set(0, 0.62, 0.85);
  group.add(pacNipple);

  /* Small chubby torso — a short wide cylinder */
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.48, 0.7, 16), skinMat);
  torso.position.set(0, 0.0, 0);
  group.add(torso);

  /* Diaper — a white box at the bottom of the torso */
  const diaper = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 0.85), diaperMat);
  diaper.position.set(0, -0.42, 0);
  group.add(diaper);

  /* Chubby arms — short skin cylinders angled outward, with round fists */
  [-1, 1].forEach(side => {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.13, 0.55, 10), skinMat);
    arm.position.set(side * 0.68, 0.12, 0);
    arm.rotation.z = side * 1.1;
    group.add(arm);

    const fist = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), skinMat);
    fist.position.set(side * 1.0, -0.16, 0);
    group.add(fist);
  });

  /* Chubby legs — short skin cylinders below the diaper, with round feet */
  [-0.3, 0.3].forEach(xOff => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.17, 0.55, 10), skinMat);
    leg.position.set(xOff, -0.85, 0);
    group.add(leg);

    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), skinMat);
    foot.position.set(xOff, -1.16, 0.05);
    foot.scale.set(0.85, 0.65, 1.2);
    group.add(foot);
  });

  /* Scale the whole baby down so it reads at the same size as the cow/clown. */
  group.scale.set(0.32, 0.32, 0.32);

  return group;
}


/* ─────────────────────────────────────────────────────────────────────────────
   createCar(bounds, carColors) — the flying-car easter-egg, a first-class
   peer of createCow/createClown/createBaby. Built from THREE primitives only
   (Box/Cylinder/Sphere/Cone) + MeshStandardMaterial, mirroring the other
   specials. Each material is tagged with material.userData.carPart so a live
   theme switch can re-derive its color from the active theme's carColors
   palette.
   ───────────────────────────────────────────────────────────────────────────── */
function createCar(bounds, carColors) {
  const group = new THREE.Group();

  // Car material palette — theme-aware. Falls back to the dark-theme
  // values if no theme palette is supplied, so behavior is unchanged by
  // default (exactly like createCow/createClown/createBaby's cc fallback).
  const cc = carColors || {
    body: 0xff3b3b, cabin: 0xffd166, window: 0x99d9ff,
    wheel: 0x111111, hub: 0xd9d9d9, headlight: 0xffffaa,
    taillight: 0xff1744, flame: 0xff8c1a,
  };

  const bodyMat      = new THREE.MeshStandardMaterial({ color: cc.body,      roughness: 0.45, metalness: 0.25 });
  const cabinMat     = new THREE.MeshStandardMaterial({ color: cc.cabin,     roughness: 0.45, metalness: 0.15 });
  const windowMat    = new THREE.MeshStandardMaterial({ color: cc.window,    roughness: 0.18, metalness: 0.2, transparent: true, opacity: 0.85 });
  const wheelMat     = new THREE.MeshStandardMaterial({ color: cc.wheel,     roughness: 0.65, metalness: 0.1 });
  const hubMat       = new THREE.MeshStandardMaterial({ color: cc.hub,       roughness: 0.32, metalness: 0.45 });
  const headlightMat = new THREE.MeshStandardMaterial({ color: cc.headlight, roughness: 0.25, metalness: 0.15 });
  const taillightMat = new THREE.MeshStandardMaterial({ color: cc.taillight, roughness: 0.35, metalness: 0.1 });
  const flameMat     = new THREE.MeshStandardMaterial({ color: cc.flame,     roughness: 0.25, metalness: 0.05, transparent: true, opacity: 0.9 });

  // Tag each material with its logical car-part name so a live theme
  // switch can traverse the group and re-derive colors from carColors.
  bodyMat.userData.carPart      = 'body';
  cabinMat.userData.carPart     = 'cabin';
  windowMat.userData.carPart    = 'window';
  wheelMat.userData.carPart     = 'wheel';
  hubMat.userData.carPart       = 'hub';
  headlightMat.userData.carPart = 'headlight';
  taillightMat.userData.carPart = 'taillight';
  flameMat.userData.carPart     = 'flame';

  /* Body — sleek rectangular hover-car chassis */
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.55, 1.05), bodyMat);
  body.position.set(0, 0, 0);
  group.add(body);

  /* Cabin — chunky roof block plus transparent windshield */
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.55, 0.85), cabinMat);
  cabin.position.set(0.15, 0.48, 0);
  group.add(cabin);

  const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.36, 0.9), windowMat);
  windshield.position.set(0.7, 0.52, 0);
  windshield.rotation.z = -0.28;
  group.add(windshield);

  const rearWindow = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.32, 0.86), windowMat);
  rearWindow.position.set(-0.35, 0.54, 0);
  rearWindow.rotation.z = 0.2;
  group.add(rearWindow);

  /* Wheels — four little cylinders on the corners, rotated to face out */
  const wheelPositions = [
    [-0.75, -0.38, 0.58], [-0.75, -0.38, -0.58],
    [0.75, -0.38, 0.58],  [0.75, -0.38, -0.58],
  ];
  wheelPositions.forEach(([x, y, z]) => {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.18, 16), wheelMat);
    wheel.position.set(x, y, z);
    wheel.rotation.x = Math.PI / 2;
    group.add(wheel);

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2, 12), hubMat);
    hub.position.set(x, y, z + (z > 0 ? 0.02 : -0.02));
    hub.rotation.x = Math.PI / 2;
    group.add(hub);
  });

  /* Headlights and taillights */
  [-0.3, 0.3].forEach(z => {
    const headlight = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), headlightMat);
    headlight.position.set(1.24, 0.08, z);
    headlight.scale.set(0.6, 0.7, 1.0);
    group.add(headlight);

    const taillight = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), taillightMat);
    taillight.position.set(-1.24, 0.02, z);
    taillight.scale.set(0.55, 0.7, 1.0);
    group.add(taillight);
  });

  /* Wings and rocket flame — the flying-car flourish */
  [-1, 1].forEach(side => {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.06, 0.28), bodyMat);
    wing.position.set(-0.15, 0.05, side * 0.78);
    wing.rotation.y = side * 0.16;
    group.add(wing);
  });

  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.75, 14), flameMat);
  flame.position.set(-1.55, -0.02, 0);
  flame.rotation.z = Math.PI / 2;
  group.add(flame);

  /* Scale the whole car down so it reads at the same size as the cow/clown/baby. */
  group.scale.set(0.32, 0.32, 0.32);

  return group;
}


/* ─────────────────────────────────────────────────────────────────────────────
   createLeaf(bounds, leafColors) — the green-leaf easter-egg, a first-class
   peer of createCow/createClown/createBaby/createCar. Built from THREE
   primitives only (Sphere/Cylinder) + MeshStandardMaterial, mirroring the
   other specials. Each material is tagged with material.userData.leafPart so a
   live theme switch can re-derive its color from the active theme's leafColors
   palette.
   ───────────────────────────────────────────────────────────────────────────── */
function createLeaf(bounds, leafColors) {
  const group = new THREE.Group();

  // Leaf material palette — theme-aware. Falls back to green values if no
  // theme palette is supplied, so the leaf is always green by default.
  const lc = leafColors || {
    blade: 0x2e8b2e, stem: 0x1f5c1f,
  };

  const bladeMat = new THREE.MeshStandardMaterial({ color: lc.blade, roughness: 0.55, metalness: 0.05 });
  const stemMat  = new THREE.MeshStandardMaterial({ color: lc.stem,  roughness: 0.6,  metalness: 0.05 });

  // Tag each material with its logical leaf-part name so a live theme
  // switch can traverse the group and re-derive colors from leafColors.
  bladeMat.userData.leafPart = 'blade';
  stemMat.userData.leafPart  = 'stem';

  /* Blade — flattened sphere angled like a drifting leaf */
  const blade = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 16), bladeMat);
  blade.scale.set(0.85, 1.35, 0.12);
  blade.rotation.z = -0.28;
  group.add(blade);

  /* Stem — thin cylinder running through the blade */
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.055, 1.5, 10), stemMat);
  stem.rotation.z = -0.28;
  group.add(stem);

  /* Scale the whole leaf down so it reads at the same size as the cow/clown/baby/car. */
  group.scale.set(0.32, 0.32, 0.32);

  return group;
}


/* ─────────────────────────────────────────────────────────────────────────────
   createTree(bounds, treeColors) — the tree easter-egg, a first-class peer of
   createCow/createClown/createBaby/createCar. Built from THREE primitives only
   (Cylinder/Sphere/Cone) + MeshStandardMaterial, mirroring the other specials.
   Each material is tagged with material.userData.treePart so a live theme
   switch can re-derive its color from the active theme's treeColors palette.
   ───────────────────────────────────────────────────────────────────────────── */
function createTree(bounds, treeColors) {
  const group = new THREE.Group();

  // Tree material palette — theme-aware. Falls back to the dark-theme
  // values if no theme palette is supplied, so behavior is unchanged by
  // default (exactly like createCar's cc fallback).
  const tc = treeColors || {
    trunk: 0x6b3f1f, foliageLower: 0x2ed573, foliageMiddle: 0x20bf6b,
    foliageTop: 0x26de81, crown: 0x45e07f,
  };

  const trunkMat        = new THREE.MeshStandardMaterial({ color: tc.trunk,        roughness: 0.72, metalness: 0.05 });
  const foliageLowerMat = new THREE.MeshStandardMaterial({ color: tc.foliageLower, roughness: 0.55, metalness: 0.05 });
  const foliageMidMat   = new THREE.MeshStandardMaterial({ color: tc.foliageMiddle, roughness: 0.52, metalness: 0.05 });
  const foliageTopMat   = new THREE.MeshStandardMaterial({ color: tc.foliageTop,   roughness: 0.5,  metalness: 0.05 });
  const crownMat        = new THREE.MeshStandardMaterial({ color: tc.crown,        roughness: 0.48, metalness: 0.05 });

  // Tag each material with its logical tree-part name so a live theme
  // switch can traverse the group and re-derive colors from treeColors.
  trunkMat.userData.treePart        = 'trunk';
  foliageLowerMat.userData.treePart = 'foliageLower';
  foliageMidMat.userData.treePart   = 'foliageMiddle';
  foliageTopMat.userData.treePart   = 'foliageTop';
  crownMat.userData.treePart        = 'crown';

  /* Trunk — a sturdy brown cylinder anchoring the green canopy */
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 1.05, 14), trunkMat);
  trunk.position.set(0, -0.55, 0);
  group.add(trunk);

  /* Foliage — stacked green cones plus a round crown for a full evergreen */
  const lower = new THREE.Mesh(new THREE.ConeGeometry(0.95, 1.0, 18), foliageLowerMat);
  lower.position.set(0, 0.0, 0);
  group.add(lower);

  const middle = new THREE.Mesh(new THREE.ConeGeometry(0.72, 0.9, 18), foliageMidMat);
  middle.position.set(0, 0.48, 0);
  group.add(middle);

  const top = new THREE.Mesh(new THREE.ConeGeometry(0.48, 0.72, 18), foliageTopMat);
  top.position.set(0, 0.9, 0);
  group.add(top);

  const crown = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), crownMat);
  crown.position.set(0, 1.25, 0);
  crown.scale.set(0.9, 1.05, 0.9);
  group.add(crown);

  /* Scale the whole tree down so it reads at the same size as the cow/clown/baby/car. */
  group.scale.set(0.32, 0.32, 0.32);

  return group;
}


/* ══════════════════════════════════════════════════════════════════════════════
   SECTION 4 — MAIN APPLICATION
   ─────────────────────────────────────────────────────────────────────────────
   Three.js scene setup, animation loop, UI controls.
   ══════════════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════
   THEME SYSTEM — two named themes (dark / light) covering every
   color-bearing surface, CSS-driven and WebGL-driven. Dark reproduces the
   original hardwired look byte-for-byte; light is a legible dark-on-light
   variant. Default is always dark, unconditionally (no prefers-color-scheme,
   no persistence — see main()).
   ══════════════════════════════════════════════════════════════════════ */

const THEMES = {
  dark: {
    clearColor: 0x000000,

      if (!clownActive()) available.push('clown');
      if (!babyActive())  available.push('baby');
      if (!carActive())   available.push('car');
      if (!leafActive())  available.push('leaf');
      if (!treeActive())  available.push('tree');
      // Shuffle: Fisher-Yates on the small list
      for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];

      if (available.length > 0) {
        if (available[0] === 'cow')   { spawnCow();   return; }
        if (available[0] === 'clown') { spawnClown(); return; }

        if (available[0] === 'leaf')  { spawnLeaf();  return; }

            const part = child.material.userData.carPart;
            const hex = theme.carColors[part];
            if (hex !== undefined) child.material.color.setHex(hex);
          } else if (child.material && child.material.userData && child.material.userData.leafPart) {
            const part = child.material.userData.leafPart;
            const hex = theme.leafColors[part];
            if (hex !== undefined) child.material.color.setHex(hex);
          } else if (child.material && child.material.userData && child.material.userData.treePart) {
            const part = child.material.userData.treePart;
            const hex = theme.treeColors[part];
            if (hex !== undefined) child.material.color.setHex(hex);
          }
        });
      } else if (obj.material) {
        // Regular ShapeFactory mesh — re-derive color from its palette slot.
        const idx = obj.userData.colorIndex;
        const hex = (typeof idx === 'number') ? theme.palette[idx % theme.palette.length] : theme.palette[0];
        obj.material.color.setHex(hex);
      }
    });
  }

  function applyTheme(name) {
    activeTheme = name;
    const theme = THEMES[name];

    // CSS-driven surfaces
    document.body.classList.toggle('theme-light', name === 'light');

    // WebGL-driven surfaces
    renderer.setClearColor(theme.clearColor, 1);
    scene.fog.color.setHex(theme.fogColor); // density (0.018) untouched

    ambient.color.setHex(theme.lights.ambient.color);
    ambient.intensity = theme.lights.ambient.intensity;

    keyLight.color.setHex(theme.lights.key.color);
    keyLight.intensity = theme.lights.key.intensity;

    rimLight.color.setHex(theme.lights.rim.color);
    rimLight.intensity = theme.lights.rim.intensity;

    // fillLight's hue is animated every frame in animate(); set its base
    // color now (so it changes immediately) and let the mood loop use the
    // theme's saturation/lightness going forward (see animate()).
    fillLight.color.setHex(theme.lights.fill.color);
    fillLight.intensity = theme.lights.fill.intensity;

    starMat.color.setHex(theme.starColor);

    // Spawn-time palette for new shapes, and live-recolor existing ones.
    ShapeFactory.setPalette(theme.palette);
    recolorLiveShapes(theme);
  }

  const btnTheme = document.getElementById('btn-theme');
  btnTheme.addEventListener('click', () => {
    const next = activeTheme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    btnTheme.textContent = next === 'light' ? 'dark mode' : 'light mode';
  });

  /* ── Cursor auto-hide after inactivity ──────────────────────────────────── */
  let cursorTimer = null;
  const ui = document.getElementById('ui');

  function resetCursorTimer() {
    document.body.style.cursor = 'default';
    ui.classList.remove('hidden');
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => {
      document.body.style.cursor = 'none';
      ui.classList.add('hidden');
    }, 3500);
  }

  document.addEventListener('mousemove', resetCursorTimer);
  document.addEventListener('touchstart', resetCursorTimer);
  resetCursorTimer();

  /* -- Click gestures via raycasting -- */
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  // Spawn a short-lived particle burst at `position` (a THREE.Vector3) using
  // THREE.Points, animated outward + faded via its own requestAnimationFrame
  // loop so it plays out independently of the main animate() loop's state.
  // The main animate() loop keeps calling renderer.render(scene, camera)
  // every frame regardless, which is what actually draws the burst; this
  // loop only advances the particle positions/opacity and disposes cleanly
  // when the burst finishes.
  function spawnBurst(position) {
    const PARTICLE_COUNT = 60;
    const DURATION = 0.8; // seconds

    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      positions[i * 3]     = position.x;
      positions[i * 3 + 1] = position.y;
      positions[i * 3 + 2] = position.z;

      // Random outward direction on a sphere, random speed.
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      const speed = 1.2 + Math.random() * 2.4;
      velocities[i * 3]     = Math.sin(phi) * Math.cos(theta) * speed;
      velocities[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * speed;
      velocities[i * 3 + 2] = Math.cos(phi) * speed;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0xffd23f, // bright spark color, reads on both themes
      size: 0.09,
      transparent: true,
      opacity: 1,
      depthWrite: false,
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    let elapsed = 0;
    let lastTime = performance.now();

    function tick(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      elapsed += dt;

      const posAttr = geometry.attributes.position;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        posAttr.array[i * 3]     += velocities[i * 3]     * dt;
        posAttr.array[i * 3 + 1] += velocities[i * 3 + 1] * dt;
        posAttr.array[i * 3 + 2] += velocities[i * 3 + 2] * dt;
      }
      posAttr.needsUpdate = true;

      const t = elapsed / DURATION;
      material.opacity = Math.max(0, 1 - t);
      material.size = Math.max(0.01, 0.09 * (1 - t * 0.7));

      if (elapsed < DURATION) {
        requestAnimationFrame(tick);
      } else {
        scene.remove(points);
        geometry.dispose();
        material.dispose();
      }
    }

    requestAnimationFrame(tick);
  }

  function pickShape(event) {
    // Don't raycast if click was on UI
    if (event.target !== renderer.domElement) return null;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(shapes, true);

    if (intersects.length > 0) {
      // Find the root shape (could be a child of a group, e.g. the cow)
      let target = intersects[0].object;
      while (target.parent && !shapes.includes(target)) {
        target = target.parent;
      }
      if (shapes.includes(target)) {
        return target;
      }
    }
    // Empty-space click does nothing
    return null;
  }

  renderer.domElement.addEventListener('dblclick', (event) => {
    const target = pickShape(event);
    if (target) {
      // Double-click: explode-delete. Capture world position before the
      // shape is removed, burst there, then delete. No keep-one floor.
      const burstPosition = target.getWorldPosition(new THREE.Vector3());
      spawnBurst(burstPosition);
      removeShape(target);
    }
  });

  renderer.domElement.addEventListener('click', (event) => {
    const target = pickShape(event);
    if (target) {
      // Plain click: freeze toggle.
      intentEngine.toggleFrozen(target);
    }
  });

  function resolveCollisions() {
    const minDistance = COLLISION_RADIUS * 2;
    const minDistanceSq = minDistance * minDistance;
    const EPSILON = 0.0001;
    // Restitution: extra outward impulse so bounces read visually even at slow speeds.
    // After velocity exchange, each object gains this much additional outward normal speed.
    const RESTITUTION_BONUS = 0.35; // world-units/sec added along normal per object
    const MIN_SPEED = 0.3; // imported constant (same as in behaviors)

    for (let i = 0; i < shapes.length; i++) {
      const a = shapes[i];
      const aState = intentEngine.getState(a);
      if (!aState || !aState.vel || aState.frozen) continue;

      for (let j = i + 1; j < shapes.length; j++) {
        const b = shapes[j];
        const bState = intentEngine.getState(b);
        if (!bState || !bState.vel || bState.frozen) continue;

        let nx = b.position.x - a.position.x;
        let ny = b.position.y - a.position.y;
        let nz = b.position.z - a.position.z;
        let distSq = nx * nx + ny * ny + nz * nz;

        if (distSq >= minDistanceSq) continue;

        let dist = Math.sqrt(distSq);
        if (dist < EPSILON) {
          const angle = Math.random() * Math.PI * 2;
          nx = Math.cos(angle);
          ny = (Math.random() - 0.5) * 0.5;
          nz = Math.sin(angle);
          dist = Math.sqrt(nx * nx + ny * ny + nz * nz);
        }

        nx /= dist;
        ny /= dist;
        nz /= dist;

        // Positional push-apart so objects don't overlap
        const overlap = minDistance - Math.max(dist, EPSILON);
        const push = overlap * 0.5;
        a.position.x -= nx * push;
        a.position.y -= ny * push;
        a.position.z -= nz * push;
        b.position.x += nx * push;
        b.position.y += ny * push;
        b.position.z += nz * push;

        const relVelX = bState.vel.x - aState.vel.x;
        const relVelY = bState.vel.y - aState.vel.y;
        const relVelZ = bState.vel.z - aState.vel.z;
        const relNormalSpeed = relVelX * nx + relVelY * ny + relVelZ * nz;

        if (relNormalSpeed < 0) {
          // Elastic normal-velocity exchange
          const aNormal = aState.vel.x * nx + aState.vel.y * ny + aState.vel.z * nz;
          const bNormal = bState.vel.x * nx + bState.vel.y * ny + bState.vel.z * nz;
          const normalDelta = bNormal - aNormal;

          aState.vel.x += normalDelta * nx;
          aState.vel.y += normalDelta * ny;
          aState.vel.z += normalDelta * nz;
          bState.vel.x -= normalDelta * nx;
          bState.vel.y -= normalDelta * ny;
          bState.vel.z -= normalDelta * nz;

          // Restitution bonus: push both objects apart along the normal so the
          // bounce reads visually at slow screensaver speeds.
          // a moves in -normal direction, b moves in +normal direction.
          aState.vel.x -= nx * RESTITUTION_BONUS;
          aState.vel.y -= ny * RESTITUTION_BONUS;
          aState.vel.z -= nz * RESTITUTION_BONUS;
          bState.vel.x += nx * RESTITUTION_BONUS;
          bState.vel.y += ny * RESTITUTION_BONUS;
          bState.vel.z += nz * RESTITUTION_BONUS;

          // Ensure each object has at least MIN_SPEED of outward normal velocity
          // (so the bounce reads, not mushy) then clamp to MAX_SPEED.
          const clampSpeed = (vel) => {
            const spd = Math.sqrt(vel.x ** 2 + vel.y ** 2 + vel.z ** 2);
            if (spd > 1.8) { // MAX_SPEED = 1.8
              const s = 1.8 / spd;
              vel.x *= s; vel.y *= s; vel.z *= s;
            } else if (spd < MIN_SPEED && spd > 0.001) {
              const s = MIN_SPEED / spd;
              vel.x *= s; vel.y *= s; vel.z *= s;
            }
          };
          clampSpeed(aState.vel);
          clampSpeed(bState.vel);
        }
      }
    }
  }

  /* ── Resize handler ─────────────────────────────────────────────────────── */
  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);
  onResize();

  /* ── Animation loop ─────────────────────────────────────────────────────── */
  const clock = new THREE.Clock();

  // Slow camera drift for screensaver feel
  let camAngle = 0;

  // Accumulated mood-color time — advanced only on non-paused frames so the
  // fillLight hue doesn't jump when resuming from a backgrounded tab.
  let moodTime = 0;

  // Tab-visibility pause/resume: while the page is hidden we still keep
  // requestAnimationFrame scheduled (the browser throttles it for us), but
  // the frame body early-returns before advancing any scene state or
  // rendering. On resume we flush the clock's accumulated delta so the
  // elapsed hidden duration never gets fed into a single dt.
  let paused = document.hidden;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      paused = true;
    } else {
      clock.getDelta(); // discard time accumulated while hidden
      paused = false;
    }
  });

  function animate() {
    requestAnimationFrame(animate);

    if (paused) return;

    const dt = Math.min(clock.getDelta(), 0.1); // cap dt to avoid spiral on tab switch

    /* Camera gentle orbit */
    camAngle += dt * 0.04;
    camera.position.x = Math.sin(camAngle) * 1.5;
    camera.position.y = Math.cos(camAngle * 0.7) * 0.8;
    camera.lookAt(0, 0, 0);

    /* Tick intent engine — pure ballistic integration */
    intentEngine.update(shapes, BOUNDS, dt);
    resolveCollisions();

    /* Update HTML labels */
    if (showLabels) {
      labels.forEach(({ el, mesh }) => {
        const pos = projectToScreen(mesh);
        el.style.left = pos.x + 'px';
        el.style.top  = (pos.y - 28) + 'px';
      });
    }

    /* Animate fill light color for subtle mood shift — saturation/lightness
       are theme-keyed (via applyTheme) so switching themes doesn't get
       clobbered back to the dark-mode mood on the next frame. moodTime is
       dt-accumulated (not Date.now()) so it pauses/resumes cleanly. */
    moodTime += dt;
    const mood = THEMES[activeTheme].fillMoodHSL;
    fillLight.color.setHSL((moodTime * 0.1) % 1, mood.s, mood.l);

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
